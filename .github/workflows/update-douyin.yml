name: Update DouYin Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-douyin.yml"
      - ".github/scripts/update_douyin.py"
      - ".github/scripts/test_update_douyin.py"
  pull_request:
    paths:
      - ".github/workflows/update-douyin.yml"
      - ".github/scripts/update_douyin.py"
      - ".github/scripts/test_update_douyin.py"
      - ".github/douyin-source-snapshot.json"
      - "Rule/douyin.txt"
  schedule:
    - cron: "19 19 * * *"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: update-douyin-rules
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test DouYin rule parser
        run: python .github/scripts/test_update_douyin.py
      - name: Generate and validate DouYin rules
        run: python .github/scripts/update_douyin.py
      - name: Verify generated files are committed
        run: |
          git diff --exit-code -- Rule/douyin.txt .github/douyin-source-snapshot.json
          test -z "$(git status --porcelain --untracked-files=all)"

  update:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test DouYin rule parser
        run: python .github/scripts/test_update_douyin.py
      - name: Generate and validate DouYin rules
        run: python .github/scripts/update_douyin.py
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rule/douyin.txt .github/douyin-source-snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "update douyin rules"
            git push
          fi
