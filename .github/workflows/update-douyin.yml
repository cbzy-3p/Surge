name: Update DouYin Rules

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/update-douyin.yml"
      - ".github/scripts/update_douyin.py"
      - ".github/scripts/test_update_douyin.py"
      - ".github/douyin-source-snapshot.json"
      - "Rule/douyin.list"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: update-douyin-rules
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test DouYin rule parser
        run: python .github/scripts/test_update_douyin.py
      - name: Generate and validate DouYin rules
        run: python .github/scripts/update_douyin.py
      - name: Verify generated files are committed
        run: |
          git diff --exit-code -- Rule/douyin.list .github/douyin-source-snapshot.json
          test -z "$(git status --porcelain --untracked-files=all)"

  update:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/update-rules.yml
