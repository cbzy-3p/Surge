name: Update CN Additional Domain Set

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cn-additional-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build and validate domain set
        run: |
          python .github/scripts/test_update_cn_additional.py
          python .github/scripts/update_cn_additional.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update CN additional domain set"
          file_pattern: Rule/CN-Additional.list
