name: Update CN Additional Domain Set

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cn-additional-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build and validate domain set
        run: |
          python .github/scripts/test_update_cn_additional.py
          python .github/scripts/update_cn_additional.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "Update CN additional domain set"
          file_pattern: Rule/CN-Additional.list
