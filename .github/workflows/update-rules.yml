name: Update Multi-source Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-rules.yml"
      - ".github/scripts/update_rules.py"
  pull_request:
    paths:
      - ".github/workflows/update-rules.yml"
      - ".github/scripts/update_rules.py"
      - "Rules/**"

permissions:
  contents: write

concurrency:
  group: update-multisource-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate and validate multi-source rules
        run: python .github/scripts/update_rules.py

      - name: Verify generated files are committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- Rules/*.list

      - name: Commit changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rules/*.list
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "update multi-source rules"
            git push
          fi
