name: Update XiaoHongShu Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-xiaohongshu.yml"
      - ".github/scripts/update_xiaohongshu.py"
      - ".github/scripts/test_update_xiaohongshu.py"
  pull_request:
    paths:
      - ".github/workflows/update-xiaohongshu.yml"
      - ".github/scripts/update_xiaohongshu.py"
      - ".github/scripts/test_update_xiaohongshu.py"
      - ".github/xiaohongshu-source-snapshot.json"
      - "XiaoHongShu.list"
  schedule:
    - cron: "23 19 * * *"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: update-xiaohongshu-rules
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test XiaoHongShu rule parser
        run: python .github/scripts/test_update_xiaohongshu.py

      - name: Merge and validate XiaoHongShu rules
        run: python .github/scripts/update_xiaohongshu.py

      - name: Verify generated files are committed
        run: |
          git diff --exit-code -- XiaoHongShu.list .github/xiaohongshu-source-snapshot.json
          test -z "$(git status --porcelain --untracked-files=all)"

  update:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test XiaoHongShu rule parser
        run: python .github/scripts/test_update_xiaohongshu.py

      - name: Merge and validate XiaoHongShu rules
        run: python .github/scripts/update_xiaohongshu.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XiaoHongShu.list .github/xiaohongshu-source-snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "update xiaohongshu rules"
            git push
          fi

  notify:
    needs: update
    if: always() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Report scheduled update status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_RESULT: ${{ needs.update.result }}
        shell: bash
        run: |
          set -euo pipefail
          title="Scheduled XiaoHongShu rule update failed"
          issue_url="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json title,url --jq '.[] | select(.title == "Scheduled XiaoHongShu rule update failed") | .url' | head -n 1)"
          if [ "$UPDATE_RESULT" = "failure" ]; then
            body="The scheduled XiaoHongShu rule update failed. Run: $RUN_URL"
            if [ -n "$issue_url" ]; then
              gh issue comment "$issue_url" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [ -n "$issue_url" ]; then
            gh issue comment "$issue_url" --body "The scheduled XiaoHongShu rule update recovered. Run: $RUN_URL"
            gh issue close "$issue_url"
          fi
