name: Update XiaoHongShu Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-xiaohongshu.yml"
      - ".github/scripts/update_xiaohongshu.py"
  schedule:
    - cron: "23 19 * * *"

permissions:
  contents: write

concurrency:
  group: update-xiaohongshu-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Merge and validate XiaoHongShu rules
        run: python .github/scripts/update_xiaohongshu.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add XiaoHongShu.list
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "update xiaohongshu rules"
            git push
          fi
