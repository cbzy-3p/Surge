name: Update XiaoHongShu Rules

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/update-xiaohongshu.yml"
      - ".github/scripts/update_xiaohongshu.py"
      - ".github/scripts/test_update_xiaohongshu.py"
      - ".github/xiaohongshu-source-snapshot.json"
      - "Rule/XiaoHongShu.list"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: update-xiaohongshu-rules
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test XiaoHongShu rule parser
        run: python .github/scripts/test_update_xiaohongshu.py

      - name: Merge and validate XiaoHongShu rules
        run: python .github/scripts/update_xiaohongshu.py

      - name: Verify generated files are committed
        run: |
          git diff --exit-code -- Rule/XiaoHongShu.list .github/xiaohongshu-source-snapshot.json
          test -z "$(git status --porcelain --untracked-files=all)"

  update:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test XiaoHongShu rule parser
        run: python .github/scripts/test_update_xiaohongshu.py

      - name: Merge and validate XiaoHongShu rules
        run: python .github/scripts/update_xiaohongshu.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rule/XiaoHongShu.list .github/xiaohongshu-source-snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "update xiaohongshu rules"
            git push
          fi
