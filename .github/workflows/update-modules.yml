name: Update Surge Modules

on:
  workflow_dispatch:
  schedule:
    # 00:29 Beijing time
    - cron: "29 16 * * *"

permissions:
  contents: write

concurrency:
  group: update-surge-modules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch fixed module sources and rebuild aggregates
        run: python .github/scripts/update_modules.py
      - name: Validate generated module files
        run: |
          python .github/scripts/update_modules.py --validate-only
          git diff --check -- . ':(exclude)Module/Scripts/*.js'
      - name: Commit validated changes to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Module
          if git diff --cached --quiet; then
            echo "No module or script source changes."
          else
            git commit -m "update surge modules and scripts"
            git push origin HEAD:main
          fi
