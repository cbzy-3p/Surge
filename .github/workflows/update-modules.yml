name: Update Surge Modules

on:
  workflow_dispatch:
  schedule:
    # 00:29 Beijing time
    - cron: "29 16 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-surge-modules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch fixed module sources and rebuild aggregates
        run: python .github/scripts/update_modules.py
      - name: Validate generated module files
        run: |
          python - <<'PY'
          from pathlib import Path
          for module in Path("Module").glob("**/*.sgmodule"):
              content = module.read_text(encoding="utf-8")
              assert content.startswith("#!name"), module
              assert "[MITM]" in content, module
              for line in content.splitlines():
                  if line.startswith("hostname ="):
                      assert line.count("%APPEND%") + line.count("%INSERT%") <= 1, (module, line)
                      assert "%APPEND% %APPEND%" not in line, (module, line)
          print("Module validation passed.")
          PY
          git diff --check
      - name: Create or refresh review PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Module; then
            echo "No module source changes."
            exit 0
          fi
          branch="automation/module-source-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add Module
          git commit -m "update surge modules"
          git push --force origin "$branch"
          number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "update surge modules" --body "Automated fixed-source module update. Validation and diff checks passed."
          else
            gh pr create --base main --head "$branch" --title "update surge modules" --body "Automated fixed-source module update. Validation and diff checks passed."
          fi
