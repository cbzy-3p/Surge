name: Sync Telegram Rules

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-telegram-rules
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test rule compactor
        run: python .github/scripts/test_compact_rule_file.py

      - name: Download Telegram rules
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="Rule/Telegram"
          RAW_FILE="$OUT_DIR/.telegram_all.raw"
          mkdir -p "$OUT_DIR"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://ruleset.skk.moe/List/non_ip/telegram.conf" \
            -o "$OUT_DIR/SukkaW-Telegram.list"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://ruleset.skk.moe/List/ip/telegram.conf" \
            -o "$OUT_DIR/SukkaW-TelegramCIDR.list"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/TelegramASN.list" \
            -o "$OUT_DIR/RabbitSpec-TelegramASN.list"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list" \
            -o "$OUT_DIR/blackmatrix7-Telegram.list"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Ruleset/Extra/Telegram.list" \
            -o "$OUT_DIR/ConnersHua-Telegram.list"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/telegramcidr.txt" \
            -o "$OUT_DIR/Loyalsoldier-TelegramCIDR.list"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 \
            "https://raw.githubusercontent.com/Yuu518/Yuu-rules/rule-set/surge/geosite/telegram.list" \
            -o "$OUT_DIR/Yuu518-Telegram.list"

          cat \
            "$OUT_DIR/SukkaW-Telegram.list" \
            "$OUT_DIR/SukkaW-TelegramCIDR.list" \
            "$OUT_DIR/RabbitSpec-TelegramASN.list" \
            "$OUT_DIR/blackmatrix7-Telegram.list" \
            "$OUT_DIR/ConnersHua-Telegram.list" \
            "$OUT_DIR/Loyalsoldier-TelegramCIDR.list" \
            "$OUT_DIR/Yuu518-Telegram.list" \
            | sed 's/\r$//' \
            | sed 's/[[:space:]]*\/\/.*$//' \
            | awk '{$1=$1; print}' \
            | awk 'NF && $0 !~ /^#/ && $0 !~ /^OR,/' \
            | grep -v '7h15.ru1353t.1s.m4d3.by.5ukk4w.skk.moe' \
            | awk '!seen[$0]++' > "$RAW_FILE"

          {
            echo "# NAME: Telegram_All"
            echo "# AUTHOR: cbzy-3p"
            echo "# SORT: PROCESS-NAME > DOMAIN > DOMAIN-SUFFIX > DOMAIN-KEYWORD > IP-CIDR > IP-CIDR6 > IP-ASN"
            echo "# SOURCE: SukkaW List/non_ip/telegram.conf and List/ip/telegram.conf"
            echo "# SOURCE: Rabbit-Spec/Surge Rules/TelegramASN.list"
            echo "# SOURCE: blackmatrix7/ios_rule_script rule/Surge/Telegram/Telegram.list"
            echo "# SOURCE: ConnersHua/RuleGo Surge/Ruleset/Extra/Telegram.list"
            echo "# SOURCE: Loyalsoldier/surge-rules ruleset/telegramcidr.txt"
            echo "# SOURCE: Yuu518/Yuu-rules surge/geosite/telegram.list"
            echo
            awk -F, '$1 == "PROCESS-NAME"' "$RAW_FILE" | LC_ALL=C sort -t, -k2,2 -u
            echo
            awk -F, '$1 == "DOMAIN"' "$RAW_FILE" | LC_ALL=C sort -t, -k2,2 -u
            echo
            awk -F, '$1 == "DOMAIN-SUFFIX"' "$RAW_FILE" | LC_ALL=C sort -t, -k2,2 -u
            echo
            awk -F, '$1 == "DOMAIN-KEYWORD"' "$RAW_FILE" | LC_ALL=C sort -t, -k2,2 -u
            echo
            awk -F, '$1 == "IP-CIDR"' "$RAW_FILE" | LC_ALL=C sort -t, -k2,2V -u
            echo
            awk -F, '$1 == "IP-CIDR6"' "$RAW_FILE" | LC_ALL=C sort -t, -k2,2 -u
            echo
            awk -F, '$1 == "IP-ASN"' "$RAW_FILE" | LC_ALL=C sort -t, -k2,2n -u
          } > "$OUT_DIR/Telegram_All.list"

          rm -f "$RAW_FILE"
          python .github/scripts/compact_rule_file.py "$OUT_DIR/Telegram_All.list"

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Rule/Telegram
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sync telegram rules"
            git push
          fi
