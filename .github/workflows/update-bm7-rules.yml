name: Update BM7 Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "37 19 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-bm7-rules.yml"
      - ".github/scripts/update_bm7_rules.py"

permissions:
  contents: write

concurrency:
  group: update-bm7-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Merge and validate BM7 rules
        run: python .github/scripts/update_bm7_rules.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rules/BM7
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "update BM7 rules"
            git push
          fi
